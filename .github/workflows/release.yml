name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tags must use three numeric parts such as v0.0.001."
          }
          "version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish CodexGUI.csproj --configuration Release --runtime win-x64
          --self-contained true --output artifacts/publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Publish single-file executable
        run: >-
          dotnet publish CodexGUI.csproj --configuration Release --runtime win-x64
          --self-contained true --output artifacts/single-file
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package release and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/CodexGUI-win-x64.zip
          $hash = (Get-FileHash artifacts/CodexGUI-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/CodexGUI-win-x64.zip.sha256 -Value "$hash  CodexGUI-win-x64.zip" -NoNewline
          $exeHash = (Get-FileHash artifacts/single-file/CodexGUI.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/CodexGUI.exe.sha256 -Value "$exeHash  CodexGUI.exe" -NoNewline

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "artifacts/single-file/CodexGUI.exe"
          "artifacts/CodexGUI.exe.sha256"
          "artifacts/CodexGUI-win-x64.zip"
          "artifacts/CodexGUI-win-x64.zip.sha256"
          --title "${{ github.ref_name }}"
          --generate-notes

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codexgui-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # release notes need the previous version tag and its commit history

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compare project version with latest release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Compare-Versions([string]$left, [string]$right) {
            $leftParts = $left.Split('.')
            $rightParts = $right.Split('.')
            for ($index = 0; $index -lt 3; $index++) {
              $leftNumber = $leftParts[$index] -replace '^0+', ''
              $rightNumber = $rightParts[$index] -replace '^0+', ''
              if ($leftNumber.Length -eq 0) { $leftNumber = '0' }
              if ($rightNumber.Length -eq 0) { $rightNumber = '0' }
              if ($leftNumber.Length -ne $rightNumber.Length) {
                return [Math]::Sign($leftNumber.Length - $rightNumber.Length)
              }
              $comparison = [string]::CompareOrdinal($leftNumber, $rightNumber)
              if ($comparison -ne 0) { return $comparison }
            }
            return 0
          }

          [xml]$project = Get-Content -LiteralPath 'Build/CodexGUI.csproj' -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Project version must use three numeric parts: $version"
          }

          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $releaseTags = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          $latestVersion = '0.0.000'
          foreach ($tag in $releaseTags) {
            if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { continue }
            $candidate = $Matches[1]
            if ((Compare-Versions $candidate $latestVersion) -gt 0) { $latestVersion = $candidate }
          }

          $comparison = Compare-Versions $version $latestVersion
          if ($comparison -lt 0) { throw "Project version $version is older than latest release $latestVersion." }
          $shouldRelease = $comparison -gt 0
          if ($shouldRelease) {
            Write-Host "Release v$version is newer than v$latestVersion."
          } else {
            Write-Host "Release v$version already exists; nothing to publish."
          }
          $previousTag = if ($latestVersion -eq '0.0.000') { '' } else { "v$latestVersion" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Run focused regression checks
        run: dotnet run --project Tests/CodexGUI.Checks.csproj --configuration Release

      - name: Publish self-contained Windows app
        if: steps.version.outputs.should_release == 'true'
        run: >-
          dotnet publish Build/CodexGUI.csproj --configuration Release --runtime win-x64
          --self-contained true --output artifacts/publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Publish single-file executable
        if: steps.version.outputs.should_release == 'true'
        run: >-
          dotnet publish Build/CodexGUI.csproj --configuration Release --runtime win-x64
          --self-contained true --output artifacts/single-file
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package release and checksum
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          CODEXGUI_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CODEXGUI_RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/CodexGUI-win-x64.zip
          $hash = (Get-FileHash artifacts/CodexGUI-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/CodexGUI-win-x64.zip.sha256 -Value "$hash  CodexGUI-win-x64.zip" -NoNewline
          $exeHash = (Get-FileHash artifacts/single-file/CodexGUI.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/CodexGUI.exe.sha256 -Value "$exeHash  CodexGUI.exe" -NoNewline
          if ([string]::IsNullOrWhiteSpace($env:CODEXGUI_RELEASE_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the CODEXGUI_RELEASE_SIGNING_PRIVATE_KEY Actions secret before publishing releases.'
          }
          $signer = [System.Security.Cryptography.ECDsa]::Create()
          try {
            $signer.ImportFromPem($env:CODEXGUI_RELEASE_SIGNING_PRIVATE_KEY)
            $manifest = "$env:RELEASE_VERSION`n$hash  CodexGUI-win-x64.zip"
            $payload = [System.Text.Encoding]::UTF8.GetBytes($manifest)
            $signature = $signer.SignData($payload, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
            [System.IO.File]::WriteAllText('artifacts/CodexGUI-win-x64.zip.sig', [Convert]::ToBase64String($signature))
          }
          finally { $signer.Dispose() }

      - name: Build release notes from changes since the previous version
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_RELEASE_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previousTag = $env:PREVIOUS_RELEASE_TAG
          $range = 'HEAD'
          if ($previousTag) {
            git rev-parse --verify --quiet "refs/tags/$previousTag^{commit}" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Previous release tag $previousTag is not available." }
            git merge-base --is-ancestor $previousTag HEAD
            if ($LASTEXITCODE -ne 0) { throw "Previous release tag $previousTag is not an ancestor of HEAD." }
            $range = "$previousTag..HEAD"
          }

          $notes = @{
            Added   = [System.Collections.Generic.List[string]]::new()
            Changed = [System.Collections.Generic.List[string]]::new()
            Fixed   = [System.Collections.Generic.List[string]]::new()
          }
          $history = git log --no-merges '--format=%H%x1f%s%x1f%b%x1e' $range | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release commit history.' }
          foreach ($record in $history.Split([char]0x1e, [StringSplitOptions]::RemoveEmptyEntries)) {
            $fields = $record.Trim() -split ([char]0x1f), 3
            if ($fields.Count -ne 3) { continue }
            $commit = $fields[0].Trim()
            $subject = $fields[1].Trim()
            $body = $fields[2]
            if ($subject -match '^Bump version to [0-9]+\.[0-9]+\.[0-9]+$') { continue }
            $changedPaths = @(git diff-tree --no-commit-id --name-only -r $commit)
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect files changed by commit '$subject'." }
            $hasProductChanges = @($changedPaths | Where-Object {
              $_ -notmatch '^(?:\.github/|\.codex/|Tests/|AGENTS\.md$|README\.md$)'
            }).Count -gt 0
            if (-not $hasProductChanges) { continue }
            $noteCount = 0
            foreach ($line in ($body -split '\r?\n')) {
              if ($line -match '^Release-Note-(Added|Changed|Fixed):\s*(.+)$') {
                $category = $Matches[1]
                $note = $Matches[2].Trim()
                if ($note -notmatch '\p{IsCyrillic}') {
                  throw "Release note in commit '$subject' must be written in Russian."
                }
                $notes[$category].Add($note)
                $noteCount++
              }
            }
            if ($noteCount -eq 0) {
              throw "Commit '$subject' has no Release-Note-Added, Release-Note-Changed, or Release-Note-Fixed trailer. Add a concise user-facing release note or use a version-bump commit."
            }
          }

          $sections = [ordered]@{
            Added = '✨ Новое'
            Changed = '🎨 Улучшения'
            Fixed = '🛠 Исправления'
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("# CodexGUI v$env:RELEASE_VERSION")
          $lines.Add('')
          $lines.Add('Главное в этом обновлении:')
          foreach ($category in $sections.Keys) {
            if ($notes[$category].Count -eq 0) { continue }
            $lines.Add('')
            $lines.Add("## $($sections[$category])")
            foreach ($item in $notes[$category]) { $lines.Add("- $item") }
          }
          if (($notes.Added.Count + $notes.Changed.Count + $notes.Fixed.Count) -eq 0) {
            $lines.Add('')
            $lines.Add('В этом выпуске нет пользовательских изменений.')
          }
          if ($previousTag) {
            $lines.Add('')
            $lines.Add("_Список изменений: $previousTag → v$env:RELEASE_VERSION._")
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          [System.IO.File]::WriteAllLines('artifacts/release-notes.md', $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          "artifacts/single-file/CodexGUI.exe"
          "artifacts/CodexGUI.exe.sha256"
          "artifacts/CodexGUI-win-x64.zip"
          "artifacts/CodexGUI-win-x64.zip.sha256"
          "artifacts/CodexGUI-win-x64.zip.sig"
          --target "${{ github.sha }}"
          --title "v${{ steps.version.outputs.version }}"
          --notes-file "artifacts/release-notes.md"

      - name: Delete older releases and tags
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          function Get-VersionParts([string]$tag) {
            if ($tag -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') { return $null }
            return @($Matches[1], $Matches[2], $Matches[3])
          }

          function Compare-VersionTags([string]$left, [string]$right) {
            $leftParts = Get-VersionParts $left
            $rightParts = Get-VersionParts $right
            for ($index = 0; $index -lt 3; $index++) {
              $leftNumber = $leftParts[$index] -replace '^0+', ''
              $rightNumber = $rightParts[$index] -replace '^0+', ''
              if ($leftNumber.Length -eq 0) { $leftNumber = '0' }
              if ($rightNumber.Length -eq 0) { $rightNumber = '0' }
              if ($leftNumber.Length -ne $rightNumber.Length) {
                return [Math]::Sign($leftNumber.Length - $rightNumber.Length)
              }
              $comparison = [string]::CompareOrdinal($leftNumber, $rightNumber)
              if ($comparison -ne 0) { return $comparison }
            }
            return 0
          }

          $currentTag = "v$env:RELEASE_VERSION"
          if ($null -eq (Get-VersionParts $currentTag)) { throw "Invalid release tag: $currentTag" }
          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $releaseTags = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_.tagName })

          foreach ($oldTag in $releaseTags) {
            if ($null -eq (Get-VersionParts $oldTag)) { continue }
            if ($oldTag -eq $currentTag -or (Compare-VersionTags $oldTag $currentTag) -ge 0) { continue }
            gh release delete $oldTag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Could not delete older release $oldTag." }
          }

          $remoteTags = git ls-remote --refs origin 'refs/tags/v*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list remote version tags.' }

          foreach ($line in $remoteTags) {
            $remoteRef = ($line -split "`t")[1]
            $oldTag = $remoteRef.Substring('refs/tags/'.Length)
            if ($null -eq (Get-VersionParts $oldTag)) { continue }
            if ($oldTag -eq $currentTag -or (Compare-VersionTags $oldTag $currentTag) -ge 0) { continue }
            git push origin --delete $oldTag
            if ($LASTEXITCODE -ne 0) { throw "Could not delete older tag $oldTag." }
          }
